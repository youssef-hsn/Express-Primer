name: express-primer

services:
  postgres:
    image: postgres:18-alpine
    container_name: express-primer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: primer
      POSTGRES_PASSWORD: primer
      POSTGRES_DB: express_primer
    ports:
      - '5432:5432'
    volumes:
      # postgres:18+ stores data under /var/lib/postgresql/<major>, not /data
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U primer -d express_primer']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
