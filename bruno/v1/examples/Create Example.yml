info:
  name: Create Example
  type: http
  seq: 2

http:
  method: POST
  url: '{{base-url}}/v1/examples'
  headers:
    - name: x-request-id
      value: bruno-create-1
      enabled: true
  body:
    type: json
    data: |-
      {
        "name": "First example",
        "status": "active",
        "notes": "Created from Bruno"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test('responds 201', function () {
          expect(res.status).to.equal(201);
        });
    - type: after-response
      code: |-
        if (res.status === 201) {
          bru.setEnvVar('example-id', res.body.data.id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Create Example

  Creates an example and stores its id in the `example-id` environment variable
  so the detail, update and delete requests below can run straight after.

  ## Headers

  | Header       | Required | Description                                                              |
  | ------------ | -------- | ------------------------------------------------------------------------ |
  | x-request-id | yes      | Enforced by `requireHeader('x-request-id')`, a demonstration middleware factory. |

  ## Body — `application/json`

  | Field  | Type           | Required | Constraints          | Description                    |
  | ------ | -------------- | -------- | -------------------- | ------------------------------ |
  | name   | string         | yes      | 1–255 chars, unique among live rows | Display name.   |
  | status | enum           | no       | `active`, `archived` | Defaults to `active`.          |
  | notes  | string \| null | no       | ≤ 2000 chars         | Free text.                     |

  ## Success — 201

  ```json
  { "data": { "id": "<uuid>", "name": "<string>", "status": "active", "notes": "<string | null>", "createdAt": "<ISO 8601>", "updatedAt": "<ISO 8601>", "deletedAt": null } }
  ```

  ## Errors

  | Status | When                                                                     |
  | ------ | ------------------------------------------------------------------------ |
  | 400    | Missing `x-request-id`, or a body that fails validation.                 |
  | 401    | Missing or undecodable bearer token.                                     |
  | 409    | A live example already uses that `name`. Soft-deleted names are free to reuse. |
